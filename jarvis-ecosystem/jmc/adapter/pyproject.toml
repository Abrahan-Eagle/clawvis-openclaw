[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jmc-adapter"
version = "1.0.0"
description = "Jarvis Mission Control adapter (API local; lectura de estado + escritura acotada de modo)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "slowapi>=0.1.9",
  "pyyaml>=6",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["../tests"]

# Opcional: `pip install ruff` y `ruff check app` desde `jmc/adapter/`
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
