# CI for the monorepo: Agent Town (Next.js + Phaser) lives under agent-town/
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-and-automations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked files for secrets
        run: bash scripts/check-no-secrets.sh

      - name: Check automations YAML drift
        run: bash jarvis-ecosystem/scripts/sync-automations-yaml.sh --check

  agent-town:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-town
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Monorepo: packageManager solo en agent-town/package.json (no hay package.json en la raíz)
          package_json_file: agent-town/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-town/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
